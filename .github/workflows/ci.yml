name: CI/CD Pipeline

on:
  workflow_dispatch: # Allow manual triggering
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release, Debug]
        compiler:
          - { cc: gcc-13, cxx: g++-13 }
          - { cc: clang, cxx: clang++ }
        exclude:
          # macOS doesn't have gcc-13 in default repos
          - os: macos-latest
            compiler: { cc: gcc-13, cxx: g++-13 }

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsqlite3-dev
          if [ "${{ matrix.compiler.cc }}" = "gcc-13" ]; then
            sudo apt-get install -y gcc-13 g++-13
          fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Configure CMake
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DTIMEBALL_BUILD_TESTS=ON \
            -G Ninja

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      # Every test binary, on every compiler and build type: Release runs the
      # NDEBUG-only tests, Debug runs the death tests.
      - name: Test
        run: ctest --test-dir build --output-on-failure
